  <body data-page="admin" data-admin-section="room-reservations">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <header class="site-header"><div class="header-inner"><a class="brand" href="index.html" aria-label="BOOK TO LEARN &amp; RUN 홈"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-copy"><strong>BOOK TO LEARN &amp; RUN</strong><small>PUBLIC LIBRARY SERVICE</small></span></a><form class="header-search" role="search"><label class="sr-only" for="header-search-admin-room">도서 검색</label><input id="header-search-admin-room" name="q" type="search" placeholder="책 제목, 저자, 키워드 검색" /><button type="submit" aria-label="검색"><span aria-hidden="true">⌕</span><span class="search-text">검색</span></button></form><div class="auth-area" data-auth-area></div></div><nav class="main-nav" aria-label="주요 메뉴"><div class="nav-inner"><a href="index.html">홈</a><a href="search.html">도서검색</a><a href="mypage.html">마이페이지</a></div></nav></header>
    <main id="main-content" class="page-main admin-main">
      <div class="shell">
        <div class="admin-heading"><p class="eyebrow">ADMINISTRATION · READING ROOM</p><h1>열람실 관리</h1><p>예약자, 이용 시간과 선택 좌석을 확인하고 예약을 취소합니다.</p></div>
        <p id="admin-page-message" class="form-message" role="alert" aria-live="assertive"></p>
        <div id="admin-content" hidden>
          <section id="room-reservations" class="admin-panel admin-panel-first">
            <div class="admin-panel-heading"><div><p class="eyebrow">RESERVATIONS</p><h2>열람실 예약 현황</h2><p>현재 예정된 예약을 시간과 좌석별로 확인할 수 있습니다.</p></div><button id="refresh-admin-room-reservations" class="button button-secondary" type="button">새로고침</button></div>
            <form id="admin-room-filter" class="admin-list-filter" role="search">
              <div><label for="admin-room-query">예약자 검색</label><input id="admin-room-query" type="search" placeholder="이름, 아이디 또는 이메일" autocomplete="off" /></div>
              <div><label for="admin-room-date-filter">이용 날짜</label><input id="admin-room-date-filter" type="date" /></div>
              <div><label for="admin-room-sort">정렬</label><select id="admin-room-sort"><option value="soonest">이용 시간 빠른 순</option><option value="latest">이용 시간 늦은 순</option><option value="name">예약자 이름순</option></select></div>
              <button class="button button-primary" type="submit">검색</button><button id="admin-room-filter-reset" class="button button-secondary" type="button">초기화</button>
              <p id="admin-room-filter-summary" class="admin-list-filter-summary" role="status" aria-live="polite"></p>
            </form>
            <div id="admin-room-reservation-list" class="admin-room-reservation-list" role="status" aria-live="polite"></div>
            <nav id="admin-room-pagination" class="admin-pagination" aria-label="열람실 예약 목록 페이지"></nav>
          </section>
        </div>
      </div>
    </main>
